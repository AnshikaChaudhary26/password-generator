
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🔐 Password Generator</h1>

        <div class="password-box">
            <input type="text" id="password" placeholder="Your password" readonly>
            <button onclick="copyPassword()">📋</button>
        </div>

        <label>Password Length: <span id="lengthValue">12</span></label>

        <input type="range" id="length" min="6" max="30" value="12">

        <label>
            <input type="checkbox" id="uppercase" checked>
            Uppercase (A-Z)
        </label>

        <label>
            <input type="checkbox" id="numbers" checked>
            Numbers (0-9)
        </label>

        <label>
            <input type="checkbox" id="symbols" checked>
            Symbols (!@#$)
        </label>

        <button class="generate" onclick="generatePassword()">
            Generate Password
        </button>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
